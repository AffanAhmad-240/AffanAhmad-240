name: Generate GitHub Stats Images
on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:        # lets you run it manually anytime from the Actions tab
  push:
    branches:
      - main

jobs:
  generate-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate stats images
        uses: jstrieb/github-stats@master
        with:
          username: AffanAhmad-240
          exclude_repos:
        env:
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
